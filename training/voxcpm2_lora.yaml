# VoxCPM2 LoRA fine-tuning on the owner's voice, for a rented GPU (about 20 GB of VRAM).
# Keys follow the VoxCPM fine-tuning guide (https://voxcpm.readthedocs.io/en/latest/finetuning/finetune.html).
# Paths match train_on_pod.sh, which unpacks the kit under /workspace.

pretrained_path: /workspace/VoxCPM2/
train_manifest: /workspace/kit/dataset/train.jsonl
val_manifest: /workspace/kit/dataset/val.jsonl
save_path: /workspace/output/lora
tensorboard: /workspace/output/logs

sample_rate: 16000      # AudioVAE encoder input rate; the exported clips are 16 kHz.
out_sample_rate: 48000

batch_size: 16          # Lower to 8 (and raise grad_accum_steps to 2) if the GPU runs out of memory.
grad_accum_steps: 1
max_batch_tokens: 8192
num_workers: 2
preprocessing_num_workers: 8

# About 175 training clips at batch 16 is roughly 11 steps per pass over the data. The guide
# says 1-3 passes are usually enough for one speaker, but small LoRA runs often need more, so
# checkpoints are saved every 50 steps and compared by ear with make_samples.py.
num_iters: 300
max_steps: 300
log_interval: 10
valid_interval: 25
save_interval: 50

learning_rate: 0.0001
weight_decay: 0.01
warmup_steps: 20

lambdas:
  loss/diff: 1.0
  loss/stop: 1.0

lora:
  enable_lm: true
  enable_dit: true
  enable_proj: false
  r: 32
  alpha: 32
  dropout: 0.0
