# VoxCPM2 LoRA fine-tuning on the owner's voice, for a rented GPU.
# Matches VoxCPM 2.0.3 conf/voxcpm_v2/voxcpm_finetune_lora.yaml (checked on the pod, 2026-11-20),
# with a shorter run: about 175 clips at an effective batch of 16 is roughly 11 optimizer steps
# per pass, so checkpoints are saved every 50 steps and compared by ear with make_samples.py.
pretrained_path: /workspace/VoxCPM2/
train_manifest: /workspace/kit/dataset/train.jsonl
val_manifest: /workspace/kit/dataset/val.jsonl
sample_rate: 16000        # AudioVAE encoder input rate; the exported clips are 16 kHz.
out_sample_rate: 48000
batch_size: 2
grad_accum_steps: 8       # effective batch size 16
num_workers: 8
num_iters: 300
log_interval: 10
valid_interval: 25
save_interval: 50
learning_rate: 0.0001
weight_decay: 0.01
warmup_steps: 20
max_steps: 300
max_batch_tokens: 8192
max_grad_norm: 1.0
save_path: /workspace/output/lora
tensorboard: /workspace/output/logs
lambdas:
  loss/diff: 1.0
  loss/stop: 1.0
lora:
  enable_lm: true
  enable_dit: true
  enable_proj: false
  r: 32
  alpha: 32
  dropout: 0.0
